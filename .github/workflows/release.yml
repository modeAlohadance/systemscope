name: Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: New version tag
        default: v0.1.0
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python -c "import subprocess; subprocess.run(['build/Release/SystemScope.exe', '--smoke'], check=True, timeout=30)"
      - run: New-Item -ItemType Directory dist; Copy-Item build/Release/SystemScope.exe dist/
      - run: python .github/release.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_NAME: SystemScope
          RELEASE_TAG: ${{ inputs.tag }}
